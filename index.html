<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Demonstração · SDR com IA</title>
  <meta name="description" content="Demonstração guiada do SDR com IA e CRM: a Rubi atende, qualifica e agenda em segundos.">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="rubi-api-base" content="https://oliveiraia-production.up.railway.app">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="guiada.css?v=1">
  <script src="guiada.js?v=1" type="module"></script>
</head>
<body>
  <div class="topline" aria-hidden="true"><i id="topline"></i></div>
  <main id="stage" class="stage" tabindex="-1"></main>

  <nav id="dock" class="dock" aria-label="Navegação da demonstração">
    <div class="dock-main">
      <span class="dock-ico" id="dock-ico" aria-hidden="true"></span>
      <div class="dock-text">
        <p class="dock-label" id="dock-label"></p>
        <h2 class="dock-title" id="dock-title"></h2>
        <p class="dock-desc" id="dock-desc"></p>
      </div>
      <div class="dock-actions">
        <span class="dock-hint" id="dock-hint"></span>
        <button class="dock-btn ghost" type="button" data-action="presenter" title="Painel da apresentadora (P)" aria-label="Abrir painel da apresentadora"></button>
        <button class="dock-btn ghost" type="button" data-action="hide-dock" title="Esconder controles (H)" aria-label="Esconder controles"></button>
        <button class="dock-btn" type="button" id="prev" data-action="prev" aria-label="Voltar"></button>
        <button class="dock-btn primary" type="button" id="next" data-action="next"><span>Avançar</span></button>
      </div>
    </div>
    <div class="dock-progress" id="dock-progress"></div>
  </nav>
  <button class="dock-show" id="dock-show" type="button" data-action="hide-dock" hidden>Mostrar controles</button>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <noscript><p class="noscript">Ative o JavaScript para ver a demonstração. <a href="simulador.html">Abrir o simulador</a>.</p></noscript>
</body>
</html>
